# Purpose:
#   Scan the SBOM of the latest released version for known vulnerabilities within a gitlab schedule.
#   Checks what was actually shipped, so vulnerabilities disclosed after the release are found.
#
# Dependency:
#   Job "security:sbom", which publishes the SBOM to the project's Generic Package Registry
#
# Notes:
#   - Run it from a pipeline schedule, the job fails above GRYPE_FAIL_ON, which triggers the
#     schedule owner's failed pipeline notification, which is easily missed. So it also posts to
#     MS Teams when DEPLOYER_CONFIG_NOTIFICATION_MSTEAMS_WEBHOOK (a workflows webhook) is set.
#   - SBOM_FILE and SBOM_PACKAGE_NAME must equal the values of security:sbom.
#   - The SBOM version is the highest semantic version among the newest 100 packages of
#     SBOM_PACKAGE_NAME. GitLab does not document job token access for the package list endpoint,
#     so set SBOM_VERSION in the schedule if the lookup is rejected, or to scan a specific release
#     instead, for example a hotfix of an older release line that is deployed to prod.
#   - Only vulnerabilities with an available fix are reported, an unfixable finding cannot be
#     acted upon and would fail the schedule until upstream releases a patch.
#   - The grype archive is verified against the checksums of the release, GRYPE_VERSION is the
#     reproducibility anchor.
#
security:sbom:scan:scheduled:
  image:
    name: alpine:latest
  stage: security
  dependencies: [ ]
  variables:
    GIT_STRATEGY: none
    GRYPE_VERSION: "0.120.1"
    ## Lowest severity that fails the job: negligible, low, medium, high or critical
    GRYPE_FAIL_ON: "high"
    SBOM_FILE: "sbom.cdx.json"
    SBOM_PACKAGE_NAME: "sbom"
    SBOM_VERSION: ""
  script:
    - apk add --no-cache curl jq
    - >
      case "$(uname -m)" in
        x86_64) GRYPE_ARCH=amd64 ;;
        aarch64) GRYPE_ARCH=arm64 ;;
        *) echo "Unsupported architecture $(uname -m)"; exit 1 ;;
      esac
    - GRYPE_ARCHIVE="grype_${GRYPE_VERSION}_linux_${GRYPE_ARCH}.tar.gz"
    - GRYPE_RELEASE_URL="https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}"
    - curl --fail --show-error --silent --location --output "/tmp/${GRYPE_ARCHIVE}" "${GRYPE_RELEASE_URL}/${GRYPE_ARCHIVE}"
    - curl --fail --show-error --silent --location --output /tmp/grype-checksums.txt "${GRYPE_RELEASE_URL}/grype_${GRYPE_VERSION}_checksums.txt"
    - grep " ${GRYPE_ARCHIVE}\$" /tmp/grype-checksums.txt > /tmp/grype-archive.sha256
    - (cd /tmp && sha256sum -c grype-archive.sha256)
    - tar -xz -f "/tmp/${GRYPE_ARCHIVE}" -C /usr/local/bin grype
    - |
      if [ -z "${SBOM_VERSION}" ]; then
        PACKAGES_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages?package_type=generic&package_name=${SBOM_PACKAGE_NAME}&order_by=created_at&sort=desc&per_page=100"
        curl --fail --show-error --silent --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --output /tmp/packages.json "${PACKAGES_URL}"
        SBOM_VERSION=$(jq -r --arg name "${SBOM_PACKAGE_NAME}" '[.[] | select(.name == $name and (.version | test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))) | {version, semver: (.version | split(".") | map(tonumber))}] | sort_by(.semver) | .[-1].version // empty' /tmp/packages.json)
      fi
    - SBOM_VERSION="${SBOM_VERSION#v}"
    - '[ -n "${SBOM_VERSION}" ] || { echo "No SBOM package found, run the security:sbom job on a release tag first"; exit 1; }'
    - printf '%s\n' "${SBOM_VERSION}" > /tmp/sbom-version
    - echo "Scanning SBOM of version ${SBOM_VERSION}"
    - >
      curl --fail --show-error --silent --location
      --header "JOB-TOKEN: ${CI_JOB_TOKEN}"
      --output "${SBOM_FILE}"
      "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${SBOM_PACKAGE_NAME}/${SBOM_VERSION}/${SBOM_FILE}"
    - >
      grype "sbom:${SBOM_FILE}"
      --only-fixed
      --fail-on "${GRYPE_FAIL_ON}"
      --output table
      --output "json=grype-report.json"
  after_script:
    - |
      if [ "${CI_JOB_STATUS}" = "failed" ] && [ -n "${DEPLOYER_CONFIG_NOTIFICATION_MSTEAMS_WEBHOOK}" ] && [ -z "${DEPLOYER_CONFIG_NOTIFICATION_MUTE}" ]; then
        VERSION="$(cat /tmp/sbom-version 2>/dev/null)"
        jq -n --arg text "Der Security-Scan von **${CI_PROJECT_PATH}** (SBOM-Version **${VERSION:-unbekannt}**) ist fehlgeschlagen. [Job öffnen](${CI_JOB_URL})" \
          '{type: "message", attachments: [{contentType: "application/vnd.microsoft.card.adaptive", content: {"$schema": "http://adaptivecards.io/schemas/adaptive-card.json", type: "AdaptiveCard", version: "1.4", msTeams: {width: "full"}, body: [{type: "TextBlock", text: $text, size: "medium", wrap: true}]}}]}' \
          | curl --fail --show-error --silent --max-time 10 --header "Content-Type: application/json" --data @- "${DEPLOYER_CONFIG_NOTIFICATION_MSTEAMS_WEBHOOK}" \
          || echo "Teams notification could not be sent"
      fi
  artifacts:
    when: always
    paths:
      - grype-report.json
    expire_in: 1 month
  rules:
    - if: $CI_JOB_NAME == $SCHEDULE_TASK_NAME
      when: always
    - when: never
  resource_group: $CI_COMMIT_REF_NAME

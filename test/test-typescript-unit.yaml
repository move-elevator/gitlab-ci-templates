# Purpose:
#   Run TypeScript unit tests without a deployed instance
#
# Dependency:
#   Npm script "test:ts:unit"
#
test:typescript:unit:
  image:
    name: ${DEFAULT_IMAGE_BUILD_NODE}
  stage: test.unit
  needs:
    - build:node
  script:
    - npm run test:ts:unit
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: always
    - if: $CI_COMMIT_TAG || $CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "pipeline" || $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_TAG == null
      changes:
        - "**/*.{ts,tsx}"
        - "tsconfig.json"
        - "*.config.{js,ts,mjs}"
        - "package.json"
        - "package-lock.json"

# Purpose:
#   Run PHP unit tests without a deployed instance
#
# Dependency:
#   Composer package "phpunit/phpunit" and a composer script "test:php:unit"
#
test:php:unit:
  # runs on the default image instead of the composer image, the tests execute project code and need its extensions
  stage: test.unit
  needs:
    - build:php
  script:
    - composer run test:php:unit
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: always
    - if: $CI_COMMIT_TAG || $CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "pipeline" || $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_TAG == null
      changes:
        - "**/*.php"
        - "**/phpunit*.xml*"
        - "Build/**/*"
        - "Tests/**/*"
        - "composer.json"
        - "composer.lock"

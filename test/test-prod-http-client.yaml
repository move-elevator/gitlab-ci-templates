# Purpose:
#   Test prod with jetbrains http tests
#
test:prod:http:
  stage: test.e2e.prod
  image: jetbrains/intellij-http-client
  needs:
    - cache:prod:warmup
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "pipeline" || $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+$/
      when: manual
    - when: never
  variables:
    HTTP_TEST_DIR: tests/http
    HTTP_ENV_FILE: http-client.env.json
    HTTP_ENV: production
    HTTP_BASE_PATH: _api
    HTTP_BASE_URL: https://$DOMAIN_PROD/
  script:
    - echo -e "\e[33mRunning http tests on $HTTP_BASE_URL$HTTP_BASE_PATH\e[0m"
    - |
      for file in ${HTTP_TEST_DIR}/*.http; do
        ijhttp "$file" \
          --env="${HTTP_ENV}" \
          --env-file="${HTTP_ENV_FILE}" \
          --insecure \
          --env-variables "host=${HTTP_BASE_URL}${HTTP_BASE_PATH}"
      done

# Purpose:
#   Test a feature branch instance with playwright
#
# Dependency:
#   Npm package "@playwright/test" in the version of PLAYWRIGHT_VERSION and a npm script "test:e2e"
#   The playwright config reads the target from process.env.BASE_URL
#
test:feature:playwright:
  image:
    name: mcr.microsoft.com/playwright:v${PLAYWRIGHT_VERSION}-noble
  stage: test.e2e.feature
  needs:
    - build:node
    - cache:feature:warmup
  rules:
    - if: $CI_COMMIT_TAG || $CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "pipeline" || $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_REF_NAME =~ /^(main|feature-.*|[A-Z]{2,}-\d+-.*|[^\/]+\/.*)$/
  script:
    - !reference [.normalize-feature-name, script]
    - export BASE_URL="https://$DOMAIN_STAGE/${FEATURE_NAME}/"
    - echo -e "\e[33mRunning Playwright tests on $BASE_URL\e[0m"
    - npm run test:e2e
  artifacts:
    when: always
    paths:
      - playwright-report/
      - test-results/
    expire_in: 1 day

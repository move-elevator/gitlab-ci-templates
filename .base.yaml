#-----------------------------------------------------------------------------------------------------------------------
# DEFAULT-DOCKER-IMAGE
#-----------------------------------------------------------------------------------------------------------------------
image: ghcr.io/move-elevator/php8.4-composer:latest

#-----------------------------------------------------------------------------------------------------------------------
# CONFIGURATION
#-----------------------------------------------------------------------------------------------------------------------
variables:
  BUILD_COMPOSER_VERSION: "2.8"
  BUILD_NODE_VERSION: "22"
  DEFAULT_IMAGE_BUILD_COMPOSER: "composer:${BUILD_COMPOSER_VERSION}"
  DEFAULT_IMAGE_BUILD_NODE: "node:${BUILD_NODE_VERSION}"
  # release:prepare needs composer and npm in one image. The Node major is carried by the image
  # tag and constrained by the project's package.json "engines"; override both together.
  DEFAULT_IMAGE_RELEASE_PREPARE: "ghcr.io/move-elevator/php8.5-composer-node24:latest"
  # asset link shown on the GitLab Release page
  RELEASE_ASSET_LINK_NAME: "Container Image $CI_COMMIT_TAG"
  RELEASE_ASSET_LINK_URL: "https://$CI_REGISTRY_IMAGE/$CI_COMMIT_REF_SLUG:$CI_COMMIT_SHA"
  # Default host is stage - this is overridden in prod deployment
  SSH_USER: ${SSH_USER_STAGE}
  SSH_HOST: ${SSH_HOST_STAGE}
  SSH_PORT_STAGE: 22
  SSH_PORT_PROD: 22
  SSH_PORT: ${SSH_PORT_STAGE}

#-----------------------------------------------------------------------------------------------------------------------
# STAGES
#-----------------------------------------------------------------------------------------------------------------------
stages:
  - build
  - analyze
  - deploy.feature
  - deploy.stage
  - sync
  - cache
  - test
  - deploy.prod
  - cache.prod
  - test.prod
  - release
  - security

#-----------------------------------------------------------------------------------------------------------------------
# SSH
#-----------------------------------------------------------------------------------------------------------------------
.ssh:
  before_script:
    - DATE=`date +%s`
    - TITLE="Install SSH Key"
    - >
      echo -e "\e[0Ksection_start:${DATE}:${DATE}[collapsed=true]\r\e[0K\033[1;96m${TITLE}\033[m"
    ## Install ssh-agent if not already installed, it is required by Docker.
    ## (change apt-get to yum if you use an RPM-based image)
    - >
      type ssh-agent 2> /dev/null ||
      ( apt-get update -y && apt-get install openssh-client -y )
    ## Run ssh-agent (inside the build environment)
    - eval $(ssh-agent -s)
    ## Create the SSH directory and give it the right permissions
    - mkdir -p ~/.ssh
    ## Add the SSH key stored in SSH_KEY variable to the agent store
    ## Supports both "File" type (recommended) and "Variable" type CI/CD variables
    - >
      if [ -f "$SSH_KEY" ]; then
        chmod 400 "$SSH_KEY";
        ssh-add "$SSH_KEY";
      else
        echo "$SSH_KEY" | tr -d '\r' > /tmp/ssh_key;
        chmod 400 /tmp/ssh_key;
        ssh-add /tmp/ssh_key;
        rm -f /tmp/ssh_key;
      fi
    - touch ~/.ssh/config
    - chmod 700 -R ~/.ssh
    ## Use ssh-keyscan to scan the keys of your private server. Replace gitlab.com
    ## with your own domain name. You can copy and repeat that command if you have
    ## more than one server to connect to.
    ## add all SSH_HOST variables to known_hosts file
    - >
      printenv | grep ^SSH_HOST | while read line; do
        host="${line##*=}";
        if [ -n "$host" ]; then
          ssh-keyscan -p ${SSH_PORT} "$host" >> ~/.ssh/known_hosts || true;
        fi;
      done
    - echo "${SSH_HOST}" >> /etc/hosts
    - >
      echo -e "Host *\n\tStrictHostKeyChecking yes\n\tUserKnownHostsFile=~/.ssh/known_hosts\n\n" \
      > ~/.ssh/config
    - >
      echo -e "\e[0Ksection_end:`date +%s`:${DATE}\r\e[0K"

#-----------------------------------------------------------------------------------------------------------------------
# COMPOSER AUTHENTICATION
#-----------------------------------------------------------------------------------------------------------------------
.composer-auth:
  script:
  # projects with private composer repositories expose a token, everywhere else this is a no-op.
  # security:npm:check:scheduled references this from the node image, which ships no composer.
  - >
    if [ -n "${REGISTRY_ACCESS_TOKEN:-}" ] && command -v composer > /dev/null 2>&1; then
      composer config --auth gitlab-token.gitlab.com "$REGISTRY_ACCESS_TOKEN";
    fi

#-----------------------------------------------------------------------------------------------------------------------
# DEPLOYMENT DEPENDENCIES
#-----------------------------------------------------------------------------------------------------------------------
.check-deployment-dependencies:
  script:
  - !reference [.composer-auth, script]
  # check if composer dependencies are actually available for the next steps
  # needed for manual or scheduled jobs with expired artifacts
  - >
    if [ ! -d vendor ]; then
      composer install --ignore-platform-reqs --optimize-autoloader --no-ansi --no-interaction --no-progress --no-scripts --quiet;
    fi

#-----------------------------------------------------------------------------------------------------------------------
# FEATURE NAME
#-----------------------------------------------------------------------------------------------------------------------
.normalize-feature-name:
  script:
  # branch names may contain slashes (e.g. feature/ABC-12), deployer-tools flattens them
  # to a hyphen for the actual instance path, mirror that here to build matching URLs
  - FEATURE_NAME=$(echo "$CI_COMMIT_REF_NAME" | tr '/' '-')
